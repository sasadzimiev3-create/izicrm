# Mini App: имя sslip.io само указывает на 31.76.53.4.
# Ставится рядом с уже работающим nginx, не вместо него.
# Кабинет на порту 3000 не меняется. X-Forwarded-Proto нужен, чтобы cookie Mini App
# получила Secure только за этим прокси.
# Сертификат выпустил certbot (имя izicrm-miniapp). Повторная выкладка этого файла
# не должна стирать строки, которые certbot пометил как managed.
server {
    server_name 31.76.53.4.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/izicrm-miniapp/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/izicrm-miniapp/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = 31.76.53.4.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name 31.76.53.4.sslip.io;
    return 404; # managed by Certbot
}
