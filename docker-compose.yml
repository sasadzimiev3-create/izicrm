name: izicrm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: izicrm
      IZICRM_MAINTENANCE_PASSWORD: ${IZICRM_MAINTENANCE_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups/wal
        chown -R postgres:postgres /backups
        exec docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c archive_mode=on \
          -c archive_command='test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
      - ./deploy:/ops:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d izicrm"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/izicrm
      DATABASE_URL: postgres://izicrm_app:${IZICRM_APP_PASSWORD}@postgres:5432/izicrm
      DATABASE_MIGRATOR_URL: postgres://izicrm_migrator:${IZICRM_MIGRATOR_PASSWORD}@postgres:5432/izicrm
      DATABASE_MAINTENANCE_URL: postgres://izicrm_maintenance:${IZICRM_MAINTENANCE_PASSWORD}@postgres:5432/izicrm
    command: ["node", "dist/infrastructure/ops/bootstrap-migrate.js"]

  bot:
    build: .
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      DATABASE_URL: postgres://izicrm_app:${IZICRM_APP_PASSWORD}@postgres:5432/izicrm
      DATABASE_MIGRATOR_URL: postgres://izicrm_migrator:${IZICRM_MIGRATOR_PASSWORD}@postgres:5432/izicrm
      DATABASE_MAINTENANCE_URL: postgres://izicrm_maintenance:${IZICRM_MAINTENANCE_PASSWORD}@postgres:5432/izicrm
      TZ: ${TZ:-Europe/Moscow}
      HEALTH_HOST: 127.0.0.1
      HEALTH_PORT: "8080"
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      WEB_MINIAPP_URL: ${WEB_MINIAPP_URL:-}
    ports:
      - "3000:3000"
    stop_signal: SIGTERM

  # HTTPS для Mini App, если порты 80 и 443 свободны. Кабинет на порту 3000 не меняется.
  # Запуск: docker compose --profile miniapp up -d
  # На боевом VPS эти порты уже занимает nginx другого сайта — там этот профиль не запускать.
  # Имя — MINIAPP_HOST (по умолчанию 31.76.53.4.sslip.io). Если Let's Encrypt откажет, смените его на DuckDNS.
  caddy:
    profiles: ["miniapp"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    environment:
      MINIAPP_HOST: ${MINIAPP_HOST:-31.76.53.4.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
